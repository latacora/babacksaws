name: Continuous Delivery

on: push

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3 https://github.com/actions/checkout/commit/f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3 https://github.com/actions/setup-java/commit/17f84c3641ba7b8f6deff6309fc4c864478f5d62
        with:
          distribution: temurin
          java-version: '17'
          java-package: jre
      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@911bc4413d0c9a0d15a435af6a7181353a453e8c # 5.1 https://github.com/DeLaGuardo/setup-clojure/commit/911bc4413d0c9a0d15a435af6a7181353a453e8c
        with:
          cli: 1.11.1.1113
          github-token: ${{ secrets.GITHUB_TOKEN }}  # To avoid rate limit errors
      - name: Cache Dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3 https://github.com/actions/cache/commit/6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/.gitlibs
            ~/.m2/repository
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - run: bin/test
